agent_id: marketing_social
agent_name: MarketingSocialAgent
version: "1.0.0"
description: >
  코드가 수집·집계한 운영 채널 게시물 목록(제목+발췌)을 입력받아 채널별 키워드 ·
  카피 톤 · 인플루언서 협업 흔적 · 상품 관련성 판정(MS-D10 하이브리드 2단계) ·
  서술만 산출한다 (CM-D1 분리 — 수치 재계산 금지).
  게시 빈도 2계열·engagement·PESO·루브릭 채점은 marketing_social_node 코드 책임.
  설계: docs/design/marketing_social_node_design.md §5-2 (MS-D7·MS-D10).

# 실행 백엔드
backend: claude_cli            # ClaudeCodeCliAnalyzer

# 출력 형식 — call_with_schema() 사용
output_format: json

# 호출 단위 — 리포트당 1회 (MS-D7)
call_unit: per_report

# 캐시 — agent_cache (키: 채널·게시물 payload 해시)
cache:
  enabled: true
  ttl_hours: null

# Rubric 정합
rubric_section: "Rubric §2-3"   # docs/reference/report_taxonomy.md
report_type: marketing_social

files:
  system_prompt: ./agents/marketing_social/system_prompt_kr.md
  output_schema: ./agents/marketing_social/output.schema.json
