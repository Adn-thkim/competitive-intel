agent:
  name: FeatureExtractionAgent
  version: 0.1.0
  description: Extract structured product profiles and normalized features from validated official sources.

runtime:
  model: gpt-5.4
  temperature: 0.1
  max_output_tokens: 5000
  timeout_ms: 120000

files:
  spec: ./agents/feature_extraction/spec.md
  system_prompt: ./agents/feature_extraction/system_prompt.md
  input_schema: ./agents/feature_extraction/input.schema.json
  output_schema: ./agents/feature_extraction/output.schema.json

validation:
  require_json_output: true
  validate_input_schema: true
  validate_output_schema: true
  fail_on_schema_error: true

extraction_rules:
  official_sources_only: true
  prefer_verified_sources: true
  allow_likely_official_sources: true
  allow_ambiguous_sources_if_flagged: false
  preserve_source_traceability: true
  normalize_to_schema: travel-card-v1
  max_sources_per_target: 3

missing_value_policy:
  default_unknown_value: unknown
  allow_not_found: true
  allow_requires_manual_check: true
  require_manual_review_when_source_coverage_is_partial: true

confidence_bands:
  high:
    min: 0.8
    max: 1.0
  medium:
    min: 0.55
    max: 0.79
  low:
    min: 0.3
    max: 0.54
