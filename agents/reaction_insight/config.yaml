agent_id: reaction_insight
agent_name: ReactionInsightAgent
version: "1.0.0"
description: >
  코드가 집계한 aspect × polarity 매트릭스(채널 가중치 적용)를 입력받아 aspect 별
  인사이트 서술·종합 요지만 산출한다 (CM-D1 분리 — 수치 재계산 금지).
  집계·가중치·suggestion 분리·루브릭 채점은 reaction_insight_node 코드 책임.
  설계: docs/design/reaction_insight_node_design.md §6 (RI-D6·RI-D7).

# 실행 백엔드
backend: claude_cli            # ClaudeCodeCliAnalyzer

# 출력 형식 — call_with_schema() 사용
output_format: json

# 호출 단위 — 리포트당 1회
call_unit: per_report

# 캐시 — agent_cache (키: 집계 payload 해시)
cache:
  enabled: true
  ttl_hours: null

# Rubric 정합
rubric_section: "Rubric §2-2"   # docs/reference/report_taxonomy.md
report_type: reaction_insight

files:
  system_prompt: ./agents/reaction_insight/system_prompt_kr.md
  output_schema: ./agents/reaction_insight/output.schema.json
