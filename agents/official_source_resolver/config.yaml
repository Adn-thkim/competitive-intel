agent:
  name: OfficialSourceResolverAgent
  version: 0.1.0
  description: Resolve and validate official product sources for own and competitor products.

runtime:
  model: gpt-5.4
  temperature: 0.1
  max_output_tokens: 4000
  timeout_ms: 120000

files:
  spec: ./agents/official_source_resolver/spec.md
  system_prompt: ./agents/official_source_resolver/system_prompt.md
  input_schema: ./agents/official_source_resolver/input.schema.json
  output_schema: ./agents/official_source_resolver/output.schema.json

validation:
  require_json_output: true
  validate_input_schema: true
  validate_output_schema: true
  fail_on_schema_error: true

resolution_rules:
  include_own_product: true
  include_competitor_candidates: true
  prefer_product_pages_over_brand_homepages: true
  allow_help_center_sources: true
  allow_pricing_and_faq_sources: true
  reject_third_party_domains: true
  keep_ambiguous_sources_if_flagged: true
  max_sources_per_target: 3

stages:
  - name: brand_official_domain_discovery
    required: true
    output_field: domain_discovery_results
  - name: official_page_validation
    required: true
    output_field: page_validation_results

exploration_rules:
  require_real_domain_discovery: true
  capture_search_queries: true
  keep_rejected_domain_candidates: true
  max_domain_candidates_per_target: 5

validation_rules:
  require_live_page_check: true
  capture_final_url: true
  capture_http_status: true
  capture_page_title: true
  capture_canonical_url_when_available: true
  prefer_selected_pages_with_validation_evidence: true

confidence_bands:
  high:
    min: 0.8
    max: 1.0
  medium:
    min: 0.55
    max: 0.79
  low:
    min: 0.3
    max: 0.54

output_defaults:
  needs_validation_default: true
  include_unresolved_targets: true
