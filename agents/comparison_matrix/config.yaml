agent_id: comparison_matrix
agent_name: ComparisonMatrixAgent
version: "1.0.0"
description: >
  코드가 feature_pool로 구성한 비교 매트릭스 표를 입력받아 Zone 판정·Harvey Balls·
  루브릭 자체 평가만 산출한다 (CM-D1 코드/LLM 책임 분리). 표 수치 재생성 금지.
  설계: docs/design/comparison_matrix_node_design.md.

# 실행 백엔드 — CM-D4 (기본 경로 원칙: 결정론 요건 노드 아님)
backend: claude_cli            # ClaudeCodeCliAnalyzer

# 출력 형식 — call_with_schema() 사용
output_format: json

# 호출 단위 — 리포트당 1회
call_unit: per_report

# 캐시 — agent_cache (키: feature_table 해시 + own_candidate_id)
cache:
  enabled: true
  ttl_hours: null

# Rubric 정합
rubric_section: "Rubric §2-1"   # docs/reference/report_taxonomy.md
report_type: comparison_matrix

files:
  system_prompt: ./agents/comparison_matrix/system_prompt_kr.md
  output_schema: ./agents/comparison_matrix/output.schema.json
